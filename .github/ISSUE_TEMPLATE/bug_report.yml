name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        Please be as specific as possible — it helps us fix it faster.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "Example: When I select NestJS + React and reach the generation step, clicking Download does nothing."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the bug?
      placeholder: |
        1. Open the wizard
        2. Select stack: NestJS + React
        3. Add a model with 3 fields
        4. Click Download
        5. Nothing happens / error appears
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or error messages
      description: Paste any console errors or screenshots here.

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "Chrome 124, Firefox 126, Safari 17..."

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Windows 11, macOS 14, Ubuntu 22..."
