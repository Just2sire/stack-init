name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement!
        Describe the problem you're facing and how you imagine the solution.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or limitation you're running into.
      placeholder: "I always have to manually add X after generating because the wizard doesn't support it..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about?

  - type: dropdown
    id: area
    attributes:
      label: Which area does this affect?
      options:
        - Wizard UI / UX
        - Code generator (ZIP output)
        - YAML generation
        - ERD / Model visualization
        - Framework support (new stack)
        - Documentation
        - Other
    validations:
      required: true
