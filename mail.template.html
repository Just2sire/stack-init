<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StackInit — Confirm your email</title>
  </head>
  <body>
    <main
      style="
        margin: 0;
        padding: 48px 16px;
        background-color: #09090b;
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      "
    >
      <!-- Card -->
      <table
        role="presentation"
        width="100%"
        cellpadding="0"
        cellspacing="0"
        style="
          max-width: 480px;
          margin: 0 auto;
          background-color: #111113;
          border: 1px solid #1e1e22;
          border-radius: 12px;
          overflow: hidden;
        "
      >
        <!-- Gold top rule -->
        <tr>
          <td
            style="height: 3px; background: linear-gradient(90deg, #d4af37, #e8c84a, #d4af37)"
          ></td>
        </tr>

        <!-- Brand -->
        <tr>
          <td align="center" style="padding: 40px 40px 32px">
            <a href="{{ .SiteURL }}" target="_blank" style="text-decoration: none">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td
                    style="
                      width: 44px;
                      height: 44px;
                      border-radius: 10px;
                      background-color: rgba(212, 175, 55, 0.08);
                      border: 1px solid rgba(212, 175, 55, 0.18);
                      text-align: center;
                      vertical-align: middle;
                      font-size: 20px;
                      line-height: 44px;
                    "
                  >
                    ⚡
                  </td>
                  <td style="padding-left: 14px; vertical-align: middle">
                    <span
                      style="
                        font-size: 20px;
                        font-weight: 700;
                        color: #fafafa;
                        letter-spacing: -0.4px;
                      "
                      >Stack</span
                    ><span
                      style="
                        font-size: 20px;
                        font-weight: 700;
                        color: #d4af37;
                        letter-spacing: -0.4px;
                      "
                      >Init</span
                    >
                  </td>
                </tr>
              </table>
            </a>
          </td>
        </tr>

        <!-- Separator -->
        <tr>
          <td style="padding: 0 40px">
            <div style="height: 1px; background-color: #1e1e22"></div>
          </td>
        </tr>

        <!-- Heading -->
        <tr>
          <td style="padding: 32px 40px 0">
            <h1
              style="
                margin: 0;
                font-size: 18px;
                font-weight: 600;
                color: #fafafa;
                text-align: center;
                line-height: 1.4;
              "
            >
              Confirm your email address
            </h1>
          </td>
        </tr>

        <!-- Body text -->
        <tr>
          <td style="padding: 14px 40px 32px">
            <p
              style="
                margin: 0;
                font-size: 14px;
                line-height: 1.7;
                color: #8b8b8b;
                text-align: center;
              "
            >
              We received a request to activate your StackInit account. Click the button below to
              verify your email.
            </p>
          </td>
        </tr>

        <!-- CTA -->
        <tr>
          <td align="center" style="padding: 0 40px 36px">
            <table
              role="presentation"
              cellpadding="0"
              cellspacing="0"
              style="border-radius: 8px; background-color: #d4af37"
            >
              <tr>
                <td align="center">
                  <a
                    href="{{ .ConfirmationURL }}"
                    target="_blank"
                    style="
                      display: inline-block;
                      padding: 12px 32px;
                      font-size: 14px;
                      font-weight: 600;
                      color: #09090b;
                      text-decoration: none;
                      letter-spacing: 0.2px;
                    "
                  >
                    Verify email
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Separator -->
        <tr>
          <td style="padding: 0 40px">
            <div style="height: 1px; background-color: #1e1e22"></div>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="padding: 24px 40px 28px">
            <p
              style="
                margin: 0 0 6px;
                font-size: 12px;
                color: #4a4a4a;
                text-align: center;
                line-height: 1.6;
              "
            >
              If you didn't request this, you can safely ignore this email.
            </p>
            <p style="margin: 0; font-size: 11px; color: #2a2a2a; text-align: center">
              © 2026
              <a href="{{ .SiteURL }}" style="color: #4a4a4a; text-decoration: none">StackInit</a> —
              Schema In. Code Out.
            </p>
          </td>
        </tr>
      </table>
    </main>
  </body>
</html>
